x-django-env: &django-env
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-cambiar-esta-clave-en-produccion}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
  POSTGRES_DB: glowhive
  POSTGRES_USER: glowhive
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-glowhive_pass}
  POSTGRES_HOST: db
  REDIS_URL: redis://redis:6379/0
  NOTIFICACIONES_SERVICE_URL: http://flask_notificaciones:5000
  ENV_TYPE: ASYNC
  ALIADO_API_URL: ${ALIADO_API_URL:-}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: glowhive
      POSTGRES_USER: glowhive
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-glowhive_pass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glowhive -d glowhive"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  django_web:
    build: .
    restart: unless-stopped
    environment:
      <<: *django-env
      RUN_MIGRATIONS: "1"
      SEED_DATA: ${SEED_DATA:-1}
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/salud/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  celery_worker:
    build: .
    restart: unless-stopped
    command: celery -A beautycommerce worker -l info
    environment:
      <<: *django-env
    volumes:
      - media_data:/app/media
    depends_on:
      django_web: {condition: service_healthy}

  flask_notificaciones:
    build: ./notificaciones_service
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/var/www/static:ro
      - media_data:/var/www/media:ro
    depends_on:
      - django_web
      - flask_notificaciones

volumes:
  pgdata:
  static_data:
  media_data: