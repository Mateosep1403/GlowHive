upstream django_app { server django_web:8000; }
upstream flask_notif { server flask_notificaciones:5000; }

server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    # Estáticos y media directos desde Nginx
    location /static/ { alias /var/www/static/; expires 7d; access_log off; }
    location /media/  { alias /var/www/media/;  expires 7d; access_log off; }

    # Funcionalidad ya migrada -> microservicio Flask (Strangler Pattern)
    location /api/v2/notificaciones/ {
        proxy_pass http://flask_notif;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    # Monolito Django: sitio web y API v1
    location / {
        proxy_pass http://django_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
    }

    # Respuesta JSON clara si un servicio cae
    error_page 502 503 504 = @servicio_caido;
    location @servicio_caido {
        default_type application/json;
        return 503 '{"error":"servicio temporalmente no disponible"}';
    }
}   